services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ajax_crud_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: ajax_crud_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ajax_crud
      MYSQL_USER: ajax_user
      MYSQL_PASSWORD: ajax_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uajax_user", "-pajax_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
